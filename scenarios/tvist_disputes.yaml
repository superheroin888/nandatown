# SPDX-License-Identifier: Apache-2.0
# Tvist 1.0: evidence-gated dispute deflection over card / BNPL rails.
#
# Six friendly-fraud disputes (cardholder received the goods; merchant holds a
# verified delivery_signed proof) are interleaved with six legitimate ones (goods
# never arrived, no evidence). Under `payments: tvist` the evidence gate
# represents the friendly fraud and refunds the legitimate disputes, so all three
# validators PASS. Swap to `payments: prepaid_credits` (below) and the naive
# issuer refunds every dispute -- the tvist_evidence_gated validator FAILS,
# demonstrating the friendly-fraud leak a generic refund path can't close.

name: tvist_disputes
description: "6 friendly-fraud + 6 legitimate disputes; evidence-gated representment."

tier: 1
seed: 42

agents:
  count: 13
  brain: state-machine
  roles:
    - name: merchant
      count: 12

layers:
  transport: in_memory
  comms: nest_native
  identity: did_key
  registry: in_memory
  auth: jwt
  trust: score_average
  # The whole point: tvist gates representment on verified evidence. Switch this
  # to `prepaid_credits` to watch tvist_evidence_gated fail on the friendly fraud.
  payments: tvist
  coordination: contract_net
  negotiation: alternating_offers
  memory: blackboard
  privacy: noop
  datafacts: datafacts_v1

task:
  type: tvist_disputes
  config:
    friendly_fraud: 6
    legitimate: 6
    threshold: 0.65

failures:
  message_drop: 0.0

duration: "ticks: 10000"

metrics:
  - message_count
  - agent_count

output:
  trace: ./traces/tvist_disputes.jsonl
