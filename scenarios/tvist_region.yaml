# SPDX-License-Identifier: Apache-2.0
# Tvist region negotiation: the governing dispute regime is chosen ahead of the
# transaction.
#
# A client and an agent each bring an ordered list of regions whose rules they
# accept (Pix, SEPA Instant, FedNow, UPI, UK FPS, Nordic) and negotiate one to
# adhere to. The transaction is then bound to that regime. Under `payments: tvist`
# every settled flow is governed by a mutually-agreed region and every recall /
# dispute adheres to it, so the validators PASS. Swap to `payments:
# prepaid_credits` (below) and there is no negotiation and no regime: every flow
# settles ungoverned, a FedNow recall reverses (its regime forbids recall), and an
# off-taxonomy dispute reason is accepted -- both region validators FAIL.

name: tvist_region
description: "Region negotiated up front; recalls and disputes adhere to the agreed regime."

tier: 1
seed: 42

agents:
  count: 11
  brain: state-machine
  roles:
    - name: party
      count: 10

layers:
  transport: in_memory
  comms: nest_native
  identity: did_key
  registry: in_memory
  auth: jwt
  trust: score_average
  # tvist negotiates a region ahead of the transaction and enforces its regime.
  # Switch to `prepaid_credits` to watch the two region validators fail.
  payments: tvist
  coordination: contract_net
  negotiation: alternating_offers
  memory: blackboard
  privacy: noop
  datafacts: datafacts_v1

task:
  type: tvist_region

failures:
  message_drop: 0.0

duration: "ticks: 10000"

metrics:
  - message_count
  - agent_count

output:
  trace: ./traces/tvist_region.jsonl
