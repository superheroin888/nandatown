# SPDX-License-Identifier: Apache-2.0
# DigiDoot use case (https://digidoot.in/#architecture): a personal AI agent for
# an Indian citizen, settled through Tvist as the dispute + escrow endpoint.
#
# Each citizen flow exercises the full Tvist stack under India's UPI regime:
# explicit consent (intent vault), region negotiated to in_upi, escrow for
# service delivery, recall to protect the citizen from a rogue charge, and a
# UPI-valid dispute. Under `payments: tvist` every citizen is protected and all
# validators PASS. Swap to `payments: prepaid_credits` (below) and there is no
# consent, no regime, and no escrow: payments exceed consent, flows settle
# ungoverned, and undelivered services pay out -- the validators FAIL.

name: tvist_digidoot
description: "DigiDoot: a personal agent per citizen, consent-bound and UPI-governed via Tvist."

tier: 1
seed: 42

agents:
  count: 13
  brain: state-machine
  roles:
    - name: party
      count: 12

layers:
  transport: in_memory
  comms: nest_native
  identity: did_key
  registry: in_memory
  auth: jwt
  trust: score_average
  # Tvist is DigiDoot's settlement + dispute endpoint: consent vault, India regime,
  # escrow, recall. Switch to `prepaid_credits` to watch the citizen protections fail.
  payments: tvist
  coordination: contract_net
  negotiation: alternating_offers
  memory: blackboard
  privacy: noop
  datafacts: datafacts_v1

task:
  type: tvist_digidoot

failures:
  message_drop: 0.0

duration: "ticks: 10000"

metrics:
  - message_count
  - agent_count

output:
  trace: ./traces/tvist_digidoot.jsonl
